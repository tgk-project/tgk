name: TinyGo Keyboard Build Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install TinyGo
        run: |
          wget https://github.com/tinygo-org/tinygo/releases/download/v0.38.0/tinygo_0.38.0_amd64.deb
          sudo dpkg -i tinygo_0.38.0_amd64.deb

      - name: Clone user keyboard template
        run: |
          git clone https://github.com/tgk-project/user-keyboard-template.git template

      - name: Copy TGK framework to template
        run: |
          cp -r ./* template/ || true
          cp -r ./.github template/ || true

      - name: Generate Wire dependencies
        working-directory: template
        run: |
          go install github.com/google/wire/cmd/wire@latest
          cd di && wire

      - name: Build firmware with TinyGo
        working-directory: template
        run: |
          mkdir -p build
          tinygo build -target=feather-nrf52840 --size short -o build/firmware.uf2 .

      - name: Verify build output
        working-directory: template
        run: |
          ls -la build/
          file build/firmware.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-firmware
          path: template/build/firmware.uf2
          retention-days: 7
